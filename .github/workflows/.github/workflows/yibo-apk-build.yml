name: YiBo APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :vector:assembleFdroidDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yibo-apk
          path: vector/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 30
